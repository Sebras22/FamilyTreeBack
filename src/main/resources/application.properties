spring.application.name=FamilyTreeBack

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3307/familytree}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:familytree}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:familytree}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
